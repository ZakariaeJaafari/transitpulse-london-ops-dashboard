version: 2

models:
  - name: line_status_snapshot
    description: >
      Grain: one row per line_id and status_date. Current status per Tube line
      per dlt load date, from bronze TfL line-status tables. Picker matches
      zoomcamp/ingest/line_status_proxy.py. MotherDuck does not apply
      BigQuery-style physical partitions; filter by date on status_date, and
      sort or group by line_id for the Tube tile (one row per line per load —
      a logical sort key, not a warehouse partition).
    columns:
      - name: line_id
        description: >
          TfL line identifier from parent bronze.tfl_line_status.id (not the
          child line_statuses.line_id column, which is null on Good Service).
        tests:
          - not_null
          - unique
      - name: status_severity
        description: >
          TfL status severity code for the picked status; lower values are worse.
          Good Service is 10.
      - name: status_description
        description: >
          Human-readable severity label from status_severity_description; empty
          string when the source field is null.
      - name: disrupted
        description: >
          Disruption proxy: true when status_severity is not 10 (Good Service).
          Not timetable delay — see docs/data-model.md.
        tests:
          - not_null
      - name: status_date
        description: >
          Calendar date of the dlt load (cast from bronze._dlt_loads.inserted_at
          for the row's _dlt_load_id), not TfL line created.
        tests:
          - not_null

  - name: weather_hourly
    description: >
      Grain: one row per hour. London Open-Meteo hourly forecast from
      bronze.weather_hourly (sample london_weather_2026-10-27.json). MotherDuck
      does not apply BigQuery-style physical partitions; filter by time on time
      (Europe/London) and use the same column to sort or group hourly rows —
      there is no line dimension to cluster on.
    columns:
      - name: time
        description: >
          Hour start in Europe/London local time (matches Open-Meteo hourly.time
          strings, e.g. 2026-10-27T00:00).
        tests:
          - not_null
          - unique
      - name: temperature_2m
        description: Air temperature at 2 m in degrees Celsius.
      - name: precipitation
        description: Hourly precipitation total in mm.
      - name: wind_speed_10m
        description: Wind speed at 10 m in km/h.

  - name: arrivals_by_line
    description: >
      Grain: one row per line_id and obs_date. Summary grouped from
      staging_arrival_updates (distinct arrival predictions). avg_predicted_seconds
      is the mean of TfL timeToStation predictions, not timetable delay. n is the
      distinct prediction count for that line on obs_date.
    columns:
      - name: line_id
        description: TfL line identifier from the line summary.
        tests:
          - not_null
          - unique
      - name: n
        description: Number of distinct arrival predictions for this line on obs_date.
        tests:
          - not_null
      - name: avg_predicted_seconds
        description: >
          Mean of TfL timeToStation (predicted seconds until train at stop), not
          delay vs timetable.
        tests:
          - not_null
      - name: obs_date
        description: Observation partition date (2026-11-01 for the demo load).
        tests:
          - not_null

  - name: arrival_updates
    description: >
      Grain: one distinct arrival prediction per stop, line, vehicle, and expected
      arrival time. From bronze.arrival_updates via staging, which removed the
      duplicate sample publish (two identical Kafka batches). time_to_station_sec
      is TfL timeToStation (predicted seconds until train at stop), not timetable
      delay.
    columns:
      - name: stop_id
        description: TfL NaPTAN stop identifier (curated StopPoint subset).
        tests:
          - not_null
      - name: line_id
        description: TfL line identifier.
        tests:
          - not_null
      - name: vehicle_id
        description: TfL vehicle identifier for this prediction.
        tests:
          - not_null
      - name: expected_arrival
        description: TfL expected arrival timestamp (ISO 8601).
        tests:
          - not_null
      - name: time_to_station_sec
        description: >
          TfL timeToStation in seconds (prediction until train at stop), not delay
          vs timetable.
        tests:
          - not_null
      - name: towards
        description: Destination name shown on the platform board.
      - name: obs_ts
        description: Observation timestamp when the poll was taken.
        tests:
          - not_null
      - name: obs_date
        description: Observation partition date (2026-11-01 for the demo load).
        tests:
          - not_null
