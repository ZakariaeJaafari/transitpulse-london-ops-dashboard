name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zoomcamp
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Pytest
        run: uv run pytest

      - name: dbt parse (local DuckDB, no warehouse)
        working-directory: zoomcamp/transitPule_dbt
        run: uv run dbt parse --profiles-dir . --target dev
